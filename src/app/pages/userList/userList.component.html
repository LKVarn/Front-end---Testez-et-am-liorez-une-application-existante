<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
</head>

<h1 class="title">EtuBlibliothèque</h1>

@if (errorMessage) {
  <div class="error-message" role="alert">
    {{ errorMessage }}
  </div>
}

<button class="btnaction" routerLink="/dashboard/userList/create">Ajouter un étudiant</button>

<div class="user-list-container">
  <table class="user-list-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Section</th>
        <th>Enregistré le</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students">
        <td>{{ student.lastName }}</td>
        <td>{{ student.firstName }}</td>
        <td>{{ student.section }}</td>
        <td>{{ student.firstVisit | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td><button class="btnaction">Modifier</button>
        <button class="btnaction">Supprimer</button>
        <button class="btnaction">Détails</button></td>
      </tr>
    </tbody>
  </table>
</div>
